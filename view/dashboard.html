
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창고 관리 대시보드</title>

    <link rel="stylesheet" href="/view/css/common.css">

    <style>
        .main {
            padding: 30px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .dashboard-header h2 {
            margin: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 18px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-card,
        .panel {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .summary-title {
            color: #6b7280;
            font-size: 14px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 12px;
        }

        .usage-panel {
            margin-bottom: 30px;
        }

        .usage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .usage-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .usage-rate {
            font-size: 25px;
            font-weight: 700;
            color: #16a34a;
        }

        .usage-bar {
            display: flex;
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .usage-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .usage-used {
            background: #16a34a;
        }

        .usage-empty {
            background: #eab308;
        }

        .usage-maintenance {
            background: #dc5555;
        }

        .usage-footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            font-size: 13px;
            color: #6b7280;
        }

        .usage-footer strong {
            color: #374151;
        }

        .section-panel {
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .section-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-select {
            min-width: 140px;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
        }

        .request-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .request-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 22px;
        }

        .request-count {
            font-size: 28px;
            font-weight: 700;
            margin-top: 12px;
        }

        .empty-message {
            color: #9ca3af;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 900px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .main {
                padding: 15px;
            }

            .dashboard-header {
                align-items: flex-start;
            }

            .summary-grid {
                gap: 10px;
            }

            .summary-card {
                padding: 15px;
            }

            .summary-value {
                font-size: 23px;
            }

            .section-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .filter-select {
                flex: 1;
                min-width: 0;
            }

            .request-grid {
                gap: 10px;
            }

            .request-box {
                padding: 15px;
            }

            .request-count {
                font-size: 23px;
            }
        }
    </style>
</head>

<body data-page="dashboard">

<div class="layout">
    <div id="sidebar-container"></div>

    <main class="main">

        <div class="dashboard-header">
            <h2>창고 관리 대시보드</h2>
        </div>

        <!-- 1. 전체 사용 현황 -->
        <section>
            <h3 class="section-title">전체 사용 현황</h3>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-title">전체 슬롯</div>
                    <div class="summary-value" id="totalSlots">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">사용 중</div>
                    <div class="summary-value status-used-text" id="usedSlots">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">빈 슬롯</div>
                    <div class="summary-value status-empty-text" id="emptySlots">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">점검 중</div>
                    <div class="summary-value status-maintenance-text" id="maintenanceSlots">0</div>
                </div>
            </div>
        </section>

        <!-- 2. 전체 사용률 -->
        <section class="panel usage-panel">
            <div class="usage-header">
                <h3>전체 사용률</h3>
                <strong class="usage-rate" id="totalUsageRate">0%</strong>
            </div>

            <div class="usage-bar">
                <div class="usage-fill usage-used" id="totalUsedFill"></div>
                <div class="usage-fill usage-maintenance" id="totalMaintenanceFill"></div>
                <!--<div class="usage-fill usage-empty" id="totalEmptyFill"></div>-->
            </div>
        </section>

        <!-- 3. 동별 사용 현황 -->
        <section class="panel section-panel">

            <div class="section-header">
                <h3>동별 사용 현황</h3>

                <div class="filter-group">
                    <select id="warehouseSelect"
                            class="filter-select"
                            onchange="changeWarehouse(this.value)">
                        <option value="">창고동 선택</option>
                    </select>

                    <select id="lineSelect"
                            class="filter-select"
                            onchange="renderWarehouseSummary()">
                        <option value="">전체 라인</option>
                    </select>
                </div>
            </div>

            <!-- 4. 동별 슬롯 -->
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-title">슬롯</div>
                    <div class="summary-value" id="dongTotalSlots">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">사용 중</div>
                    <div class="summary-value status-used-text" id="dongUsedSlots">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">빈 슬롯</div>
                    <div class="summary-value status-empty-text" id="dongEmptySlots">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">점검 중</div>
                    <div class="summary-value status-maintenance-text" id="dongMaintenanceSlots">0</div>
                </div>
            </div>

            <!-- 5. 동별 사용률 -->
            <div class="usage-header">
                <h3>동별 사용률</h3>
                <strong class="usage-rate" id="dongUsageRate">0%</strong>
            </div>

            <div class="usage-bar">
                <div class="usage-fill usage-used" id="dongUsedFill"></div>
                <div class="usage-fill usage-maintenance" id="dongMaintenanceFill"></div>
                <!--<div class="usage-fill usage-empty" id="dongEmptyFill"></div>-->
            </div>

        </section>

        <!-- 6. 요청 현황 -->
        <section class="panel section-panel">
            <h3 class="section-title">요청 현황</h3>

            <div class="request-grid">
                <div class="request-box">
                    <div class="summary-title">적재 요청</div>
                    <div class="request-count" id="storageRequests">-</div>
                </div>

                <div class="request-box">
                    <div class="summary-title">반출 요청</div>
                    <div class="request-count" id="releaseRequests">-</div>
                </div>
            </div>
        </section>

    </main>
</div>

<script src="/view/js/common.js"></script>

<script>
    // 창고별 슬롯 데이터 저장
    let warehouseData = [];

    document.addEventListener("DOMContentLoaded", async () => {
        await loadWarehouses();
        await loadRequestSummary();
    });

    // 창고동 목록 및 전체 슬롯 조회
    async function loadWarehouses() {
        try {
            const response = await fetch(`${API_BASE_URL}/warehouses`);

            if (!response.ok) {
                throw new Error("창고 목록 조회 실패");
            }

            const data = await response.json();
            const select = document.getElementById("warehouseSelect");

            select.innerHTML = "";

            // 각 창고의 슬롯 정보 조회
            warehouseData = await Promise.all(
                data.items.map(async warehouse => {
                    const slotResponse = await fetch(
                        `${API_BASE_URL}/warehouses/${warehouse.warehouse_id}/lines`
                    );

                    if (!slotResponse.ok) {
                        throw new Error(
                            `${warehouse.dong} 슬롯 조회 실패`
                        );
                    }

                    const slotData = await slotResponse.json();

                    return {
                        warehouse_id: warehouse.warehouse_id,
                        dong: warehouse.dong,
                        slots: slotData.items || []
                    };
                })
            );

            // 전체 사용 현황 계산
            const allSlots = warehouseData.flatMap(
                warehouse => warehouse.slots
            );

            renderTotalSummary(allSlots);

            // 창고 선택 목록
            warehouseData.forEach(warehouse => {
                const option = document.createElement("option");
                option.value = warehouse.warehouse_id;
                option.textContent = warehouse.dong;
                select.appendChild(option);
            });

            // 첫 번째 창고 선택
            if (warehouseData.length > 0) {
                select.value = warehouseData[0].warehouse_id;
                changeWarehouse(select.value);
            }

        } catch (error) {
            console.error(error);
            alert("창고 정보를 불러오지 못했습니다.");
        }
    }

    // 전체 사용 현황
    function renderTotalSummary(slots) {
        const total = slots.length;

        const used = slots.filter(
            x => x.status === "used"
        ).length;

        const empty = slots.filter(
            x => x.status === "empty"
        ).length;

        const maintenance = slots.filter(
            x => x.status === "maintenance"
        ).length;

        document.getElementById("totalSlots").textContent = total;
        document.getElementById("usedSlots").textContent = used;
        document.getElementById("emptySlots").textContent = empty;
        document.getElementById("maintenanceSlots").textContent =
            maintenance;

        const rate = total > 0 ? (used + maintenance) / total * 100 : 0;

        document.getElementById("totalUsageRate").textContent =
            `${rate.toFixed(1)}%`;

        document.getElementById("totalUsedFill").style.width =
            `${used / (total || 1) * 100}%`;

        document.getElementById("totalMaintenanceFill").style.width =
            `${maintenance / (total || 1) * 100}%`;

        //document.getElementById("totalEmptyFill").style.width = `${empty / (total || 1) * 100}%`;
    }

    // 창고동 변경
    function changeWarehouse(warehouseId) {
        const warehouse = warehouseData.find(
            x => String(x.warehouse_id) === String(warehouseId)
        );

        if (!warehouse) return;

        const lineSelect = document.getElementById("lineSelect");

        // 해당 창고의 라인 목록
        const lineCodes = [...new Set(
            warehouse.slots.map(x => x.line_code)
        )].sort();

        lineSelect.innerHTML =
            '<option value="">전체 라인</option>';

        lineCodes.forEach(lineCode => {
            const option = document.createElement("option");
            option.value = lineCode;
            option.textContent = `LINE ${lineCode}`;
            lineSelect.appendChild(option);
        });

        renderWarehouseSummary();
    }

    // 동별 / 라인별 사용 현황
    function renderWarehouseSummary() {
        const warehouseId =
            document.getElementById("warehouseSelect").value;

        const lineCode =
            document.getElementById("lineSelect").value;

        const warehouse = warehouseData.find(
            x => String(x.warehouse_id) === String(warehouseId)
        );

        if (!warehouse) return;

        let slots = warehouse.slots;

        // 라인을 선택한 경우 해당 라인만 필터링
        if (lineCode) {
            slots = slots.filter(
                x => x.line_code === lineCode
            );
        }

        const total = slots.length;

        const used = slots.filter(
            x => x.status === "used"
        ).length;

        const empty = slots.filter(
            x => x.status === "empty"
        ).length;

        const maintenance = slots.filter(
            x => x.status === "maintenance"
        ).length;

        document.getElementById("dongTotalSlots").textContent = total;
        document.getElementById("dongUsedSlots").textContent = used;
        document.getElementById("dongEmptySlots").textContent = empty;
        document.getElementById("dongMaintenanceSlots").textContent =
            maintenance;

        const rate = total > 0 ? (used + maintenance) / total * 100 : 0;

        document.getElementById("dongUsageRate").textContent =
            `${rate.toFixed(1)}%`;

        document.getElementById("dongUsedFill").style.width =
            `${used / (total || 1) * 100}%`;

        document.getElementById("dongMaintenanceFill").style.width =
            `${maintenance / (total || 1) * 100}%`;

        //document.getElementById("dongEmptyFill").style.width = `${empty / (total || 1) * 100}%`;
    }

    // 적재 / 반출 요청 현황
    async function loadRequestSummary() {
        try {
            const [storageResponse, releaseResponse] =
                await Promise.all([
                    fetch(`${API_BASE_URL}/requests`),
                    fetch(`${API_BASE_URL}/releases`)
                ]);

            if (!storageResponse.ok || !releaseResponse.ok) {
                throw new Error("요청 현황 조회 실패");
            }

            const storageData = await storageResponse.json();
            const releaseData = await releaseResponse.json();

            document.getElementById("storageRequests").textContent =
                storageData.total ?? storageData.items?.length ?? 0;

            document.getElementById("releaseRequests").textContent =
                releaseData.total ?? releaseData.items?.length ?? 0;

        } catch (error) {
            console.error(error);

            document.getElementById("storageRequests").textContent = "-";
            document.getElementById("releaseRequests").textContent = "-";
        }
    }
</script>

</body>
</html>
