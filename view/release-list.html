
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반출 요청 현황</title>
<link rel="stylesheet" href="/view/css/common.css">

<style>
    * { box-sizing: border-box; }

    .logo {
        font-size: 21px;
        font-weight: bold;
        padding: 5px 12px 35px;
    }

    .main {
        padding: 30px;
    }

    .header {
        margin-bottom: 25px;
    }

    .header h2 {
        margin: 0 0 7px;
        font-size: 25px;
    }

    .summary {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }

    .summary-card {
        background: white;
        border-radius: 9px;
        padding: 18px 22px;
        flex: 1;
        box-shadow: 0 2px 7px rgba(0,0,0,.04);
    }

    .summary-card .label {
        color: #8993a4;
        font-size: 13px;
    }

    .summary-card .value {
        font-size: 25px;
        font-weight: bold;
        margin-top: 8px;
    }

    .content {
        display: grid;
        grid-template-columns: minmax(700px, 1.6fr) minmax(300px, 1fr);
        gap: 20px;
        align-items: start;
    }

    .panel {
        background: white;
        border-radius: 9px;
        padding: 22px;
        box-shadow: 0 2px 7px rgba(0,0,0,.04);
        min-width: 0;
    }

    .panel h3 {
        margin: 0 0 18px;
        font-size: 17px;
    }

    .table-wrap {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        white-space: nowrap;
    }

    th {
        background: #f5f7fa;
        color: #68758a;
        font-weight: 600;
        padding: 13px 10px;
        border-bottom: 1px solid #e6eaf0;
        text-align: center;
    }

    td {
        padding: 14px 10px;
        border-bottom: 1px solid #edf0f4;
        text-align: center;
    }

    tbody tr {
        cursor: pointer;
    }

    tbody tr:hover {
        background: #f6f8fc;
    }

    tbody tr.selected {
        background: #eaf1ff;
    }

    .product-name {
        text-align: left;
        font-weight: 600;
    }

    .release-id {
        color: #526b94;
        font-weight: 600;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 15px 0;
        border-bottom: 1px solid #edf0f4;
        font-size: 14px;
        gap: 15px;
    }

    .detail-row .label {
        color: #8993a4;
        flex-shrink: 0;
    }

    .detail-row .value {
        font-weight: 600;
        text-align: right;
        word-break: break-word;
    }

    .empty-detail {
        text-align: center;
        color: #9aa4b2;
        padding: 70px 10px;
        font-size: 14px;
    }

    .complete-btn {
        width: 100%;
        margin-top: 25px;
        padding: 13px;
        border: none;
        border-radius: 7px;
        background: #dc2626;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .complete-btn:hover {
        background: #b91c1c;
    }

    .complete-btn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    .slot-image-wrap {
        width: 100%;
        margin-bottom: 20px;
        text-align: center;
    }

    .slot-image {
        max-width: 100%;
        max-height: 250px;
        object-fit: contain;
        border: 1px solid #edf0f4;
        border-radius: 7px;
    }

    .slot-image-empty {
        padding: 30px 10px;
        color: #9aa4b2;
        background: #f8fafc;
        border-radius: 7px;
        font-size: 13px;
    }

    @media (max-width: 1100px) {
        .content {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 700px) {
        .main {
            padding: 20px;
        }

        .summary {
            flex-wrap: wrap;
        }

        .summary-card {
            min-width: 130px;
        }
    }
</style>
</head>

<body data-page="release-list">

<div class="layout">
    <div id="sidebar-container"></div>

    <main class="main">

        <div class="header">
            <h2>반출 요청 현황</h2>
        </div>

        <section class="summary">
            <div class="summary-card">
                <div class="label">전체 요청</div>
                <div class="value" id="totalCount">0</div>
            </div>

            <div class="summary-card">
                <div class="label">선택된 요청</div>
                <div class="value" id="selectedCount">-</div>
            </div>
        </section>

        <section class="content">

            <!-- 반출 요청 목록 -->
            <div class="panel">
                <h3>반출 요청 목록</h3>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>요청 번호</th>
                                <th>슬롯 번호</th>
                                <th>상품 정보</th>
                                <th>요청일</th>
                            </tr>
                        </thead>

                        <tbody id="releaseList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 반출 상세 정보 -->
            <div class="panel">
                <h3>반출 상세 정보</h3>

                <div id="detailContent">
                    <div class="empty-detail">
                        목록에서 상품을 선택해주세요.
                    </div>
                </div>
            </div>

        </section>
    </main>
</div>

<script src="/view/js/common.js"></script>

<script>
    let releaseData = [];

    let selectedReleaseId = null;

    // 반출 요청 목록 조회
    async function renderReleaseList() {

        const url = `${API_BASE_URL}/releases`;

        try {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`API 오류: ${response.status}`);
            }

            const data = await response.json();

            releaseData = data.items || [];

            const tbody = document.getElementById("releaseList");

            tbody.innerHTML = releaseData.map(item => `
                <tr data-id="${item.release_id}"
                    onclick="selectRelease(${item.release_id})">

                    <td class="release-id">
                        #${item.release_id}
                    </td>

                    <td>
                        ${item.slot_id}
                    </td>

                    <td class="product-name">
                        ${item.info}
                    </td>

                    <td>
                        ${formatDate(item.create_date)}
                    </td>

                </tr>
            `).join("");

            document.getElementById("totalCount").textContent =
                data.total ?? releaseData.length;

        } catch (error) {
            alert(`반출 요청 조회 실패: ${error.message}`);
        }
    }

    // 목록 선택
    function selectRelease(releaseId) {

        const item = releaseData.find(
            x => x.release_id === releaseId
        );

        if (!item) return;

        selectedReleaseId = releaseId;

        // 선택 행 표시
        document.querySelectorAll("#releaseList tr").forEach(row => {
            row.classList.toggle(
                "selected",
                Number(row.dataset.id) === releaseId
            );
        });

        document.getElementById("selectedCount").textContent =
            `#${item.release_id}`;

        renderDetail(item);
    }

    // 반출 상세 정보 출력
    async function renderDetail(item) {

        const cd = formatDate(item.create_date);

        document.getElementById("detailContent").innerHTML = `

            <!-- 슬롯 이미지 -->
            <div class="slot-image-wrap" id="slotImageArea">
                <div class="slot-image-empty">
                    슬롯 이미지 조회 중...
                </div>
            </div>

            <div class="detail-row">
                <span class="label">반출 요청 번호</span>
                <span class="value">#${item.release_id}</span>
            </div>

            <div class="detail-row">
                <span class="label">슬롯 번호</span>
                <span class="value">${item.slot_id}</span>
            </div>

            <div class="detail-row">
                <span class="label">상품 정보</span>
                <span class="value">${item.info}</span>
            </div>

            <div class="detail-row">
                <span class="label">반출 요청일</span>
                <span class="value">${cd}</span>
            </div>

            <button class="complete-btn"
                    id="completeBtn"
                    onclick="completeRelease(${item.release_id})">
                반출 완료
            </button>
        `;

        const imageArea = document.getElementById("slotImageArea");

        try {

            // 슬롯 상세 정보 조회
            const response = await fetch(
                `${API_BASE_URL}/slots/${item.slot_id}`
            );

            if (!response.ok) {
                throw new Error(`API 오류: ${response.status}`);
            }

            const data = await response.json();

            // 조회 도중 다른 항목을 선택했다면 화면 갱신 중단
            if (selectedReleaseId !== item.release_id) {
                return;
            }

            if (data.image_data && data.image_type) {

                imageArea.innerHTML = `
                    <img
                        class="slot-image"
                        src="data:${data.image_type};base64,${data.image_data}"
                        alt="슬롯 이미지"
                    >
                `;

            } else {

                imageArea.innerHTML = `
                    <div class="slot-image-empty">
                        등록된 슬롯 이미지가 없습니다.
                    </div>
                `;
            }

        } catch (error) {

            // 다른 항목을 선택했다면 이전 조회 결과를 표시하지 않음
            if (selectedReleaseId !== item.release_id) {
                return;
            }

            imageArea.innerHTML = `
                <div class="slot-image-empty">
                    슬롯 이미지를 불러오지 못했습니다.
                </div>
            `;

            console.error("슬롯 이미지 조회 실패:", error);
        }
    }

    // 반출 처리
    async function completeRelease(releaseId) {

        if (!confirm(
            `요청 번호 #${releaseId}을(를) 반출하시겠습니까?`
        )) {
            return;
        }

        const btn = document.getElementById("completeBtn");

        btn.disabled = true;
        btn.textContent = "반출 처리 중...";

        try {

            const response = await fetch(
                `${API_BASE_URL}/releases/${releaseId}/slot`,
                {
                    method: "DELETE"
                }
            );

            if (!response.ok) {

                const errorData = await response.json().catch(() => null);

                throw new Error(
                    errorData?.detail || `API 오류: ${response.status}`
                );
            }

            alert("반출이 완료되었습니다.");

            // 화면 새로고침
            location.reload();

        } catch (error) {

            alert(`반출 처리 실패: ${error.message}`);

            btn.disabled = false;
            btn.textContent = "반출 완료";
        }
    }

    // 초기 실행
    renderReleaseList();

</script>

</body>
</html>
