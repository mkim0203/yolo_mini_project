
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>적재 요청 현황</title>
<link rel="stylesheet" href="/view/css/common.css">

<style>
    * { box-sizing: border-box; }

    .logo {
        font-size: 21px;
        font-weight: bold;
        padding: 5px 12px 35px;
    }
    
    .main {
        padding: 30px;
    }

    .header {
        margin-bottom: 25px;
    }

    .header h2 {
        margin: 0 0 7px;
        font-size: 25px;
    }

    .header span {
        color: #8993a4;
        font-size: 13px;
    }

    .summary {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }

    .summary-card {
        background: white;
        border-radius: 9px;
        padding: 18px 22px;
        flex: 1;
        box-shadow: 0 2px 7px rgba(0,0,0,.04);
    }

    .summary-card .label {
        color: #8993a4;
        font-size: 13px;
    }

    .summary-card .value {
        font-size: 25px;
        font-weight: bold;
        margin-top: 8px;
    }

    .content {
        display: grid;
        grid-template-columns: minmax(700px, 1.6fr) minmax(300px, 1fr);
        gap: 20px;
        align-items: start;
    }

    .panel {
        background: white;
        border-radius: 9px;
        padding: 22px;
        box-shadow: 0 2px 7px rgba(0,0,0,.04);
    }

    .panel h3 {
        margin: 0 0 18px;
        font-size: 17px;
    }

    .table-wrap {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        white-space: nowrap;
    }

    th {
        background: #f5f7fa;
        color: #68758a;
        font-weight: 600;
        padding: 13px 10px;
        border-bottom: 1px solid #e6eaf0;
        text-align: center;
    }

    td {
        padding: 14px 10px;
        border-bottom: 1px solid #edf0f4;
        text-align: center;
    }

    tbody tr {
        cursor: pointer;
    }

    tbody tr:hover {
        background: #f6f8fc;
    }

    tbody tr.selected {
        background: #eaf1ff;
    }

    .product-name {
        text-align: left;
        font-weight: 600;
    }

    .request-id {
        color: #526b94;
        font-weight: 600;
    }

    .detail-image {
        width: 100%;
        height: 230px;
        border-radius: 8px;
        background: #f3f5f8;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .detail-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .no-image {
        color: #9aa4b2;
        font-size: 14px;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 13px 0;
        border-bottom: 1px solid #edf0f4;
        font-size: 14px;
        gap: 15px;
    }

    .detail-row .label {
        color: #8993a4;
        flex-shrink: 0;
    }

    .detail-row .value {
        font-weight: 600;
        text-align: right;
        word-break: break-word;
    }

    .empty-detail {
        text-align: center;
        color: #9aa4b2;
        padding: 70px 10px;
        font-size: 14px;
    }

    @media (max-width: 1100px) {
        .content {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 700px) {
        .main {
            padding: 20px;
        }
        .summary {
            flex-wrap: wrap;
        }
        .summary-card {
            min-width: 130px;
        }
    }
</style>
</head>
<body data-page="request-list">
    
<div class="layout">
    <div id="sidebar-container"></div>

    <main class="main">
        <div class="header">
            <h2>적재 요청 현황</h2>
        </div>

        <section class="summary">
            <div class="summary-card">
                <div class="label">전체 요청</div>
                <div class="value" id="totalCount">0</div>
            </div>
            <div class="summary-card">
                <div class="label">선택된 요청</div>
                <div class="value" id="selectedCount">-</div>
            </div>
        </section>

        <section class="content">
            <!-- 요청 목록 -->
            <div class="panel">
                <h3>적재 요청 목록</h3>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>요청 번호</th>
                                <th>상품 정보</th>
                                <th>유통기한</th>
                                <th>요청일</th>
                            </tr>
                        </thead>
                        <tbody id="requestList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 상품 상세 정보 -->
            <div class="panel">
                <h3>상품 상세 정보</h3>

                <div id="detailContent">
                    <div class="empty-detail">
                        목록에서 상품을 선택해주세요.
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="/view/js/common.js"></script>

<script>
    // 화면 확인용 샘플 데이터
    // 실제 API 연동 시 이 배열을 API 응답 데이터로 교체
    let requestData = [];

    let selectedRequestId = null;

    // 요청 목록 출력
    async function renderRequestList() {
        const url =`${API_BASE_URL}/requests`;
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(`API 오류: ${response.status}`);
        }

        const data = await response.json();
        requestData = data.items;


        const tbody = document.getElementById("requestList");

        // 데이터 로드.

        tbody.innerHTML = requestData.map(item => `
            <tr data-id="${item.request_id}"
                onclick="selectRequest(${item.request_id})">
                <td class="request-id">#${item.request_id}</td>
                <td class="product-name">${item.info}</td>
                <td>${formatDate(item.expiry_date)}</td>
                <td>${formatDate(item.create_date)}</td>
            </tr>
        `).join("");

        document.getElementById("totalCount").textContent =
            requestData.length;
    }

    // 목록 선택
    function selectRequest(requestId) {
        const item = requestData.find(
            x => x.request_id === requestId
        );

        if (!item) return;

        selectedRequestId = requestId;

        // 선택 행 표시
        document.querySelectorAll("#requestList tr").forEach(row => {
            row.classList.toggle(
                "selected",
                Number(row.dataset.id) === requestId
            );
        });

        document.getElementById("selectedCount").textContent =
            `#${item.request_id}`;

        renderDetail(item);
    }

    // 상세 정보 및 이미지 출력
    async function renderDetail(item) {
        let imageData = '';

        const response = await fetch(
            `${API_BASE_URL}/requests/${item.request_id}`
        );

        if (response.ok) {
            const data = await response.json();
            imageData = `data:${data.image_type};base64,${data.image_data}`;
        } else {
            imageData = '';
        }

        let ed = formatDate(item.expiry_date);
        let cd = formatDate(item.create_date);

        document.getElementById("detailContent").innerHTML = `
            <div class="detail-image">
                ${
                    imageData
                    ? `<img src="${imageData}" alt="상품 이미지"
                            onerror="this.style.display='none';
                            this.parentElement.innerHTML=
                            '<div class=&quot;no-image&quot;>이미지를 불러올 수 없습니다.</div>';">`
                    : `<div class="no-image">등록된 이미지가 없습니다.</div>`
                }
            </div>

            <div class="detail-row">
                <span class="label">요청 번호</span>
                <span class="value">#${item.request_id}</span>
            </div>

            <div class="detail-row">
                <span class="label">상품 정보</span>
                <span class="value">${item.info}</span>
            </div>

            <div class="detail-row">
                <span class="label">유통기한</span>
                <span class="value">${ed}</span>
            </div>

            <div class="detail-row">
                <span class="label">요청일</span>
                <span class="value">${cd}</span>
            </div>

            <div class="detail-row">
                <span class="label">이미지 형식</span>
                <span class="value">${item.image_type || "-"}</span>
            </div>
        `;
    }

    // 초기 실행
    renderRequestList();
</script>

</body>
</html>
